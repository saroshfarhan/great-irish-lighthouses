[project]
name = "great-irish-lighthouses-pipeline"
version = "0.1.0"
description = "Data pipeline: scrape Irish Lights station pages into the app's lighthouse dataset"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.27",
    "pydantic>=2.10",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
